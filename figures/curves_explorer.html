<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>模型权益曲线对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f5f5}
#app{display:flex;height:100vh}
#sidebar{width:340px;overflow-y:auto;padding:16px;background:#fff;border-right:1px solid #ddd}
#chart{flex:1}
h2{font-size:15px;margin:0 0 12px 0;color:#333}
.model-item{display:flex;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;user-select:none;margin-bottom:4px;transition:background .15s}
.model-item:hover{background:#f0f0f0}
.model-item.active{background:#e8f4ff}
.color-box{width:14px;height:14px;border-radius:3px;margin-right:8px;flex-shrink:0;opacity:.4}
.model-item.active .color-box{opacity:1}
.model-name{flex:1;font-size:13px}
.model-item:not(.active) .model-name{color:#aaa}
.model-ret{font-size:12px;font-weight:600}
.tools{margin-bottom:12px;display:flex;gap:6px}
.tools button{flex:1;padding:6px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:12px}
.tools button:hover{background:#f0f0f0}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
<h2>模型选择（点击切换）</h2>
<div class="tools">
<button onclick="selectAll(true)">全选</button>
<button onclick="selectAll(false)">清空</button>
<button onclick="selectTop(5)">前 5</button>
<button onclick="selectTop(3)">前 3</button>
</div>
<div id="model-list"></div>
</div>
<div id="chart"></div>
</div>
<script src="curves_data.js"></script>
<script>
const data=window.CURVES_DATA;
const xAxisData=Array.from({length:data.market.length},(_,i)=>i);
const entries=Object.entries(data.curves).sort((a,b)=>b[1].return-a[1].return);
const visible={};
entries.forEach(([name])=>visible[name]=true);
const chart=echarts.init(document.getElementById('chart'));
function buildSeries(){
  const s=[{name:'市场均值',type:'line',data:data.market,color:'#000',lineStyle:{width:3,type:'dashed'},itemStyle:{color:'#000'},symbol:'none',z:100,emphasis:{focus:'series'}}];
  entries.forEach(([name,d])=>{if(!visible[name])return;s.push({name:name+' R'+d.round,type:'line',data:d.equity,color:d.color,lineStyle:{width:2},symbol:'none',emphasis:{focus:'series'}})});
  return s;
}
function render(){
  const legendData=['市场均值'].concat(entries.filter(([n])=>visible[n]).map(([n,d])=>n+' R'+d.round));
  chart.setOption({title:{text:'模型权益曲线对比（测试种子 '+data.seed+'）',left:'center',top:10,textStyle:{fontSize:16,fontWeight:'bold'}},tooltip:{trigger:'axis',valueFormatter:v=>v!=null?Number(v).toFixed(2):'-'},legend:{data:legendData,top:40,type:'scroll',textStyle:{fontSize:11},itemGap:12},grid:{left:70,right:50,top:110,bottom:100},xAxis:{type:'category',data:xAxisData,name:'交易日',nameLocation:'middle',nameGap:32},yAxis:{type:'value',name:'净值（初始=100）',nameLocation:'middle',nameGap:55,scale:true},dataZoom:[{type:'inside',start:0,end:100},{type:'slider',start:0,end:100,bottom:20,height:32,labelFormatter:v=>'Day '+v}],series:buildSeries()},true);
}
const listEl=document.getElementById('model-list');
entries.forEach(([name,d])=>{
  const div=document.createElement('div');
  div.className='model-item active';
  div.dataset.name=name;
  const retColor=d.return>=0?'#c0392b':'#27ae60';
  div.innerHTML='<div class="color-box" style="background:'+d.color+'"></div>'+'<div class="model-name">'+name+' <small style="color:#999">R'+d.round+'</small></div>'+'<div class="model-ret" style="color:'+retColor+'">'+(d.return*100).toFixed(2)+'%</div>';
  div.onclick=()=>{visible[name]=!visible[name];div.classList.toggle('active',visible[name]);render();};
  listEl.appendChild(div);
});
function setVisibility(pred){
  entries.forEach(([name],i)=>{visible[name]=pred(name,i);const el=listEl.querySelector('[data-name="'+name+'"]');el.classList.toggle('active',visible[name]);});
  render();
}
function selectAll(v){setVisibility(()=>v);}
function selectTop(n){setVisibility((_,i)=>i<n);}
window.addEventListener('resize',()=>chart.resize());
render();
</script>
</body>
</html>
